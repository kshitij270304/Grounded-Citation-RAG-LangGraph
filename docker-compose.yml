version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: grounded_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grounded_rag_frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_URL=http://backend:8000/chat
    depends_on:
      - backend
